name: Trend Targets Pro - Mandalorian Scanner

on:
  schedule:
    # Every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: 

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz numpy pandas yfinance biquote

      - name: Run trading scanner
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python script.py

      - name: Commit and push trade state updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git pull --rebase origin main || echo "No remote changes to pull"

          # THIS IS THE FIX: We added price_alerts.json and telegram_offset.json here!
          for f in price_alerts.json telegram_offset.json active_trades.json htf_cache.json xauusd_htf_cache.json decision_log.txt; do
            [ -f "$f" ] && git add "$f"
          done

          git diff --staged --quiet || (git commit -m "Auto-update bot state [skip ci]" && git push origin HEAD:main)