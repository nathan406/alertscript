name: Build, Run, and Notify

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance requests numpy pytz

      - name: Run Market Scanner Script
        run: python script.py

      # Send Telegram Notification
      - name: Send Telegram Message
        uses: appleboy/telegram-action@v1
        if: always()
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: |
            🚀 GitHub Actions Workflow Finished!
            Repository: ${{ github.repository }}
            Commit: ${{ github.sha }}

      # Send Discord Notification (Native cURL - No 3rd-party action needed)
      - name: Send Discord Message
        if: always()
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\": \"🚀 GitHub Actions Workflow Finished for **${{ github.repository }}**!\"}" \
               "${{ secrets.DISCORD_WEBHOOK_URL }}"