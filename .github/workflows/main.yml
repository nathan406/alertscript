name: Trend Targets Pro - Mandalorian Scanner

on:
  schedule:
    - cron: '*/15 * * * *' # Runs every 15 minutes
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    
    # REQUIRED: Grants the workflow permission to write/push code changes back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz numpy pandas yfinance

      - name: Run trading scanner
        run: python script.py

      - name: Commit and push trade state updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git status
          git add active_trades.json
          # Only commit and push if active_trades.json has actually changed
          git diff --staged --quiet || git commit -m "Auto-update active trades state [skip ci]"
          git push