name: Trend Targets Pro - Mandalorian Scanner

on:
  schedule:
    # Every 5 minutes — GitHub's scheduled-workflow minimum. Runs are
    # best-effort and can slip a minute or two under load, but this is the
    # tightest cadence GitHub itself supports. If genuinely second-level
    # latency is ever needed, run script.py on a VPS/Render/Railway cron
    # with `* * * * *` — no code changes required.
    #
    # COST WARNING: 288 runs/day. Public repos = free & unlimited Actions
    # minutes. Private repos = 2,000 min/month free tier, which this will
    # exceed. Keep this repo public unless you're paying for Actions.
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab


jobs:
  run-scanner:
    runs-on: ubuntu-latest

    # REQUIRED: Grants the workflow permission to write/push code changes back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz numpy pandas yfinance

      - name: Run trading scanner
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python script.py

      - name: Commit and push trade state updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Pull latest changes to avoid race conditions during 5m cron overlaps
          git pull --rebase origin main || echo "No remote changes to pull"

          # xauusd_htf_cache.json caches Twelve Data's 1h XAUUSD series so it's
          # only refetched once an hour instead of every run. decision_log.txt
          # is the permanent, searchable record of every flip decision the
          # bot has ever made. Both need to be committed alongside
          # active_trades.json or they never persist between runs (each run
          # starts from a fresh checkout).
          # Only add files that exist — on a fresh repo some of these haven't
          # been created yet, and `git add` on a missing path fails the step.
          for f in active_trades.json xauusd_htf_cache.json decision_log.txt; do
            [ -f "$f" ] && git add "$f"
          done

          # Commit only if changes exist and push explicitly to main
          git diff --staged --quiet || (git commit -m "Auto-update active trades state [skip ci]" && git push origin HEAD:main)